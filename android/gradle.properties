# One JVM for the whole build, and a big one: the Kotlin compiler and the Android build both want room.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Watching the filesystem for changes is what makes an incremental build fast. This project lives under
# OneDrive, where those notifications arrive late - and a build that is waiting for a notification that
# already went past is exactly the stall this build hit once. Gradle decides what is out of date by hashing
# files instead, which costs a second and never waits.
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The acceptance contract every Kotlin check runs against is the desktop suite's own recording,
# `GUI Source Code/GUI Test Suite/fixtures/protocol/phone_session.json`. Each module's build file resolves that
# path against the repository root this build sits inside and hands it to its tests as `ytmsd.fixture`, so no
# path is set here: a relative path in a properties file resolves against the working directory of whichever
# module's test task starts, and a contract that depends on which module ran first is not a contract.
# `-Pytmsd.fixture=...` replaces it on a machine that keeps the suite elsewhere. `7301` is the chain the
# recording was made from, and `-Pytmsd.chain=...` names it per run.
ytmsd.chain=7301

